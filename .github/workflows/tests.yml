name: Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT PROJECT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # SET UP PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.13"


      # =====================================================
      # INSTALL PYTHON DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================================
      # INSTALL PLAYWRIGHT CHROMIUM
      # =====================================================

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium


      # =====================================================
      # INSTALL OLLAMA
      # =====================================================

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh


      # =====================================================
      # START OLLAMA SERVER
      # =====================================================

      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &
          
          echo "Waiting for Ollama to start..."

          for i in {1..30}; do

            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is running."
              exit 0
            fi

            sleep 2

          done

          echo "Ollama failed to start."
          cat ollama.log
          exit 1


      # =====================================================
      # DOWNLOAD SELF-HEALING MODEL
      # =====================================================

      - name: Pull Ollama model
        run: |
          ollama pull qwen2.5-coder:1.5b


      # =====================================================
      # VERIFY OLLAMA MODEL
      # =====================================================

      - name: Verify Ollama
        run: |
          ollama list


      # =====================================================
      # INITIALIZE SMARTKART DATABASE
      # =====================================================

      - name: Initialize SmartKart database
        run: |
          python init_db.py


      # =====================================================
      # START SMARTKART
      # =====================================================

      - name: Start SmartKart Flask server
        run: |
          python app.py > server.log 2>&1 &

          echo "Waiting for SmartKart to start..."

          for i in {1..30}; do

            if curl -s http://localhost:8080 > /dev/null; then
              echo "SmartKart is running."
              exit 0
            fi

            sleep 2

          done

          echo "SmartKart failed to start."
          cat server.log
          exit 1


      # =====================================================
      # RUN PLAYWRIGHT TESTS
      # =====================================================

      - name: Run Playwright tests
        run: |
          pytest tests -v


      # =====================================================
      # SHOW LOGS IF TESTS FAIL
      # =====================================================

      - name: Show SmartKart server log
        if: failure()
        run: |
          echo "===== SMARTKART SERVER LOG ====="
          cat server.log || true


      - name: Show Ollama log
        if: failure()
        run: |
          echo "===== OLLAMA LOG ====="
          cat ollama.log || true