<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Test Scheduler</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fb;color:#172033;font-family:Segoe UI,Arial,sans-serif;padding:24px}.wrap{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}.brand{font-size:13px;font-weight:800;letter-spacing:.12em;color:#5145e5;text-transform:uppercase}.muted{color:#71809a}.nav{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.nav a,.btn{display:inline-block;border:0;border-radius:9px;padding:11px 15px;background:#5145e5;color:white;text-decoration:none;font-weight:700;cursor:pointer}.nav a{background:white;color:#5145e5;border:1px solid #dce5ef}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #e0e5ef;border-radius:15px;padding:20px;box-shadow:0 5px 18px #17203308}.card h2{margin:0 0 12px;font-size:18px}.metric{font-size:30px;font-weight:800;margin-top:8px}.label{font-size:13px;color:#71809a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d4dfef;border-radius:9px;background:white;font:inherit}.message{padding:12px;border-radius:9px;margin:12px 0}.error{background:#fff0f0;color:#a51d2d}.success{background:#e8f8ee;color:#16764f}.hidden{display:none!important}canvas{width:100%;height:240px;display:block}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f6;white-space:nowrap}th{background:#f8f9fc;color:#64748b}button:disabled{opacity:.6;cursor:wait}.login{max-width:440px;margin:8vh auto}.small{font-size:12px}@media(max-width:800px){body{padding:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">SmartKart • Test Automation</div><h1>Daily Test Scheduler</h1><p class="muted">Configure the persisted daily test schedule (India Standard Time).</p></div><a class="btn" href="/admin">Back to dashboard</a></header><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/execute">Test Execution</a><a href="/admin/summary">Execution Summary</a></nav><section class="card"><h2>Automatic execution settings</h2><div class="field"><label for="scheduleTime">Daily execution time (IST)</label><input id="scheduleTime" type="time" value="11:45" required style="max-width:220px"></div><div class="field"><label><input id="scheduleEnabled" type="checkbox" checked style="width:auto"> Enable daily automatic test execution</label></div><p id="scheduleStatus" class="muted">Loading schedule settings…</p><button id="saveBtn" class="btn">Save Schedule</button><div id="msg" class="message hidden"></div></section></main><script>const $=id=>document.getElementById(id);async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.message||'Request failed'),{status:r.status});return d}function fmt(v){if(!v)return'waiting for scheduler';const d=new Date(v);return Number.isNaN(d.getTime())?v:new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'}).format(d)+' IST'}function msg(t,k='error'){$('msg').textContent=t;$('msg').className='message '+k}async function load(){try{const d=await api('/admin/api/schedule');$('scheduleEnabled').checked=Boolean(d.enabled);$('scheduleTime').value=d.time||'11:45';$('scheduleStatus').textContent=d.enabled?'Enabled — daily at '+(d.time_label||d.time+' IST')+'. Next run: '+fmt(d.next_run):'Disabled — selected time: '+(d.time_label||d.time+' IST')}catch(e){if(e.status===401||e.status===403)location.href='/admin';else msg(e.message)}}$('saveBtn').addEventListener('click',async()=>{if(!$('scheduleTime').value){msg('Please choose a daily execution time.');return}try{const d=await api('/admin/api/schedule',{method:'POST',body:JSON.stringify({enabled:$('scheduleEnabled').checked,time:$('scheduleTime').value})});$('scheduleStatus').textContent=d.enabled?'Enabled — daily at '+d.time_label+'. Next run: '+fmt(d.next_run):'Disabled — selected time: '+d.time_label;msg(d.message||'Schedule saved.','success')}catch(e){msg(e.message)}});load();</script></body></html>
